<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Offline Photo Logo">
  <defs>
    <!-- Vibrant indigo to electric blue gradients -->
    <linearGradient id="bladeGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bladeGradB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="boltCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="darkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#darkGlow)">
    <!-- Aperture Blades (6 geometric rotating blades) -->
    <!-- Blade 1 (Top) -->
    <path d="M 256,36 C 314,36 368,60 408,98 L 290,216 L 218,136 Z" fill="url(#bladeGradA)" stroke="#06B6D4" stroke-width="2" stroke-linejoin="round"/>
    <!-- Blade 2 (Top Right) -->
    <path d="M 426,116 C 462,156 484,208 484,264 C 484,283 481,301 475,319 L 326,244 L 334,146 Z" fill="url(#bladeGradB)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
    <!-- Blade 3 (Bottom Right) -->
    <path d="M 470,336 C 446,398 399,448 338,472 L 272,330 L 342,282 Z" fill="url(#bladeGradA)" stroke="#06B6D4" stroke-width="2" stroke-linejoin="round"/>
    <!-- Blade 4 (Bottom) -->
    <path d="M 320,478 C 300,483 278,486 256,486 C 198,486 144,462 104,424 L 222,306 L 294,386 Z" fill="url(#bladeGradB)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
    <!-- Blade 5 (Bottom Left) -->
    <path d="M 86,406 C 50,366 28,314 28,258 C 28,239 31,221 37,203 L 186,278 L 178,376 Z" fill="url(#bladeGradA)" stroke="#06B6D4" stroke-width="2" stroke-linejoin="round"/>
    <!-- Blade 6 (Top Left) -->
    <path d="M 42,186 C 66,124 113,74 174,50 L 240,192 L 170,240 Z" fill="url(#bladeGradB)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>

    <!-- Center Aperture Iris (Deep Obsidian) -->
    <circle cx="256" cy="261" r="90" fill="#0c0e14" stroke="url(#cyanAccent)" stroke-width="2.5"/>

    <!-- High-Voltage Lightning Bolt (Local-first speed emblem) -->
    <polygon points="278,92 198,244 254,244 234,396 322,238 268,238" fill="url(#boltCore)" stroke="#22D3EE" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
